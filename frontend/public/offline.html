<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — PhantomVPN</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #080B14;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .container {
      text-align: center;
      max-width: 400px;
    }
    .icon {
      font-size: 72px;
      margin-bottom: 24px;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
    h1 {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #6C63FF, #00D4FF);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: rgba(255,255,255,0.5);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .retry-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 32px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      color: #fff;
      background: linear-gradient(135deg, #6C63FF, #00D4FF);
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }
    .retry-btn:hover { opacity: 0.9; transform: scale(1.02); }
    .retry-btn:active { transform: scale(0.98); }
    .status {
      margin-top: 40px;
      padding: 16px;
      border-radius: 12px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #FF6B6B;
      margin-right: 8px;
      animation: pulse 2s ease infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .status p { margin: 0; font-size: 12px; color: rgba(255,255,255,0.4); }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">👻</div>
    <h1>You're Offline</h1>
    <p>It looks like you've lost your internet connection. PhantomVPN needs a network to protect your privacy. Check your connection and try again.</p>
    <a href="/" class="retry-btn" onclick="window.location.reload(); return false;">
      ↻ Try Again
    </a>
    <div class="status">
      <p><span class="status-dot"></span>Waiting for connection...</p>
    </div>
  </div>
  <script>
    window.addEventListener('online', () => window.location.reload());
  </script>
</body>
</html>
